trigger:
  branches:
    include:
    - main
  paths:
    include:
    - terraform/*
    - app/*
    - k8s/*
    - pipelines/*

pr: none

variables:
  azureSubscription: 'bankapp-tf'
  tfBackendResourceGroup: 'tfstate-rg'
  tfBackendStorageAccount: 'tfstatebackendstore6789'
  tfBackendContainerName: 'tfstate'
  tfBackendKey: 'banking-app.tfstate'
  resourceGroupName: 'banking-app'
  acrName: 'bankingacr3456'
  aksName: 'banking-aks'
  k8sNamespace: 'banking'
  imageName: 'banking-app'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Validate
  displayName: 'Validate Infrastructure'
  jobs:
  - job: ValidateTerraform
    displayName: 'Terraform Validation'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: '$(azureSubscription)'
        backendAzureRmResourceGroupName: '$(tfBackendResourceGroup)'
        backendAzureRmStorageAccountName: '$(tfBackendStorageAccount)'
        backendAzureRmContainerName: '$(tfBackendContainerName)'
        backendAzureRmKey: '$(tfBackendKey)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: '$(azureSubscription)'
        commandOptions: '-out=tfplan'

- stage: DeployInfrastructure
  displayName: 'Deploy Infrastructure'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployTerraform
    displayName: 'Deploy Azure Resources'
    pool:
      vmImage: $(vmImageName)
    environment: 'banking-infrastructure'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              backendServiceArm: '$(azureSubscription)'
              backendAzureRmResourceGroupName: '$(tfBackendResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfBackendStorageAccount)'
              backendAzureRmContainerName: '$(tfBackendContainerName)'
              backendAzureRmKey: '$(tfBackendKey)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              environmentServiceNameAzureRM: '$(azureSubscription)'
              commandOptions: '-auto-approve'

          - task: AzureCLI@2
            displayName: 'Attach ACR to AKS'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                echo "Attaching ACR to AKS..."
                az aks update \
                  --name $(aksName) \
                  --resource-group $(resourceGroupName) \
                  --attach-acr $(acrName)
                echo "✓ ACR attached successfully!"

- stage: BuildApplication
  displayName: 'Build Docker Image'
  dependsOn: DeployInfrastructure
  condition: succeeded()
  jobs:
  - job: BuildAndPush
    displayName: 'Build and Push to ACR'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Bash@3
      displayName: 'Debug: Show Repository Contents'
      inputs:
        targetType: 'inline'
        script: |
          echo "=== SOURCE DIRECTORY ==="
          echo "$(Build.SourcesDirectory)"
          echo ""
          echo "=== ROOT CONTENTS ==="
          ls -la "$(Build.SourcesDirectory)"
          echo ""
          echo "=== SEARCHING FOR APP ==="
          find "$(Build.SourcesDirectory)" -type d -name "app" 2>/dev/null || echo "No app dir"
          echo ""
          echo "=== SEARCHING FOR DOCKERFILE ==="
          find "$(Build.SourcesDirectory)" -type f -name "Dockerfile" 2>/dev/null || echo "No Dockerfile"

    - task: AzureCLI@2
      displayName: 'Build Image using ACR Build'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          
          BUILD_ID="$(Build.BuildNumber)"
          SOURCE_DIR="$(Build.SourcesDirectory)"
          
          echo "Building Docker Image"
          echo "Source: ${SOURCE_DIR}"
          echo ""
          
          if [ ! -d "${SOURCE_DIR}/app" ]; then
            echo "ERROR: app directory missing!"
            echo "Your repository must have an app/ folder with:"
            echo "  - Dockerfile"
            echo "  - server.js"
            echo "  - package.json"
            echo "  - public/"
            echo ""
            echo "Please upload these files to your repository"
            exit 1
          fi
          
          if [ ! -f "${SOURCE_DIR}/app/Dockerfile" ]; then
            echo "ERROR: Dockerfile missing in app/"
            ls -la "${SOURCE_DIR}/app/"
            exit 1
          fi
          
          echo "✓ Files found, building..."
          
          az acr build \
            --registry $(acrName) \
            --image $(imageName):${BUILD_ID} \
            --image $(imageName):latest \
            --platform linux \
            "${SOURCE_DIR}/app"
          
          echo "✓ Build complete!"
          az acr repository show-tags --name $(acrName) --repository $(imageName) --output table

- stage: DeployToAKS
  displayName: 'Deploy to Kubernetes'
  dependsOn: BuildApplication
  condition: succeeded()
  jobs:
  - deployment: DeployApplication
    displayName: 'Deploy to AKS'
    pool:
      vmImage: $(vmImageName)
    environment: 'banking-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to AKS'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                
                BUILD_ID="$(Build.BuildNumber)"
                ACR_SERVER="$(acrName).azurecr.io"
                
                az aks get-credentials --resource-group $(resourceGroupName) --name $(aksName) --overwrite-existing
                
                cd $(Build.SourcesDirectory)/k8s
                sed -i "s|image:.*|image: ${ACR_SERVER}/$(imageName):${BUILD_ID}|g" 02-deployment.yaml
                
                kubectl apply -f 00-namespace.yaml
                kubectl apply -f 01-configmap.yaml -n $(k8sNamespace)
                kubectl apply -f 02-deployment.yaml -n $(k8sNamespace)
                kubectl apply -f 03-service.yaml -n $(k8sNamespace)
                
                kubectl rollout status deployment/$(imageName) -n $(k8sNamespace) --timeout=10m
                kubectl get pods -n $(k8sNamespace)
                
                echo "✓ Application deployed!"

          - task: AzureCLI@2
            displayName: 'Configure Application Gateway'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                
                echo "Waiting for LoadBalancer IP..."
                INTERNAL_LB_IP=""
                for i in {1..60}; do
                  INTERNAL_LB_IP=$(kubectl get svc $(imageName)-service -n $(k8sNamespace) -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
                  if [ -n "$INTERNAL_LB_IP" ]; then
                    echo "✓ LoadBalancer IP: $INTERNAL_LB_IP"
                    break
                  fi
                  sleep 10
                done
                
                if [ -z "$INTERNAL_LB_IP" ]; then
                  echo "LoadBalancer IP not ready, configure manually later"
                  exit 0
                fi
                
                APP_GW_NAME=$(az network application-gateway list --resource-group $(resourceGroupName) --query "[0].name" -o tsv)
                az network application-gateway address-pool update \
                  --gateway-name $APP_GW_NAME \
                  --resource-group $(resourceGroupName) \
                  --name backend-pool \
                  --servers $INTERNAL_LB_IP
                
                PUBLIC_IP=$(az network public-ip list --resource-group $(resourceGroupName) --query "[?contains(name, 'appgw')].ipAddress" -o tsv | head -1)
                
                echo ""
                echo "============================================"
                echo "✅ DEPLOYMENT SUCCESSFUL!"
                echo "============================================"
                echo "🌐 Application: http://$PUBLIC_IP"
                echo "🔐 Login: 5439090 / Passw0rd!!"
                echo "============================================"