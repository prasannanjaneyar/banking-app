apiVersion: v1
kind: Service
metadata:
  name: banking-app-service
  namespace: banking
  labels:
    app: banking-app
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: banking-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
